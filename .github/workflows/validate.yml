name: Validate demo candidate
on: [pull_request, push]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false
      - name: Test application and guards
        run: |
          python -m pip install -r templates/azure/app-service/python-fastapi/app/requirements.txt -r templates/azure/app-service/python-fastapi/tests/requirements.txt
          python -m pip install -r components/lifecycle-finops/requirements.txt
          python -m pytest templates/azure/app-service/python-fastapi/tests tests -q
      - name: Validate infrastructure without a cloud backend
        working-directory: templates/azure/app-service/python-fastapi/infra/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
      - name: Check the installed workflow matches the package
        run: diff .github/workflows/fastapi-azure-webapp.yml templates/azure/app-service/python-fastapi/pipelines/github-actions/deploy.yml
      - name: Validate AWS Terraform without a backend
        working-directory: templates/aws/lambda/python-http/infra/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
      - name: Compile Bicep without a cloud login
        run: |
          az bicep install --version v0.40.2
          az bicep build --file templates/azure/app-service/python-fastapi/infra/bicep/main.bicep --outfile /tmp/app-service.json
      - name: Synthesize CDK Python and TypeScript without cloud credentials
        env:
          EA_ACCOUNT_ID: '123456789012'
          EA_REGION: eu-west-1
          EA_INSTANCE: validation
          EA_PURPOSE: production
          EA_REVISION: ${{ github.sha }}
          EA_RETENTION_DAYS: '30'
          EA_OWNER_ID: validation
        run: |
          python -m pip install -r templates/aws/lambda/python-http/infra/cdk-python/requirements.lock.txt
          CDK_OUTDIR=/tmp/cdk-python python templates/aws/lambda/python-http/infra/cdk-python/app.py
          cd templates/aws/lambda/python-http/infra/cdk-typescript
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          CDK_OUTDIR=/tmp/cdk-typescript node dist/app.js
