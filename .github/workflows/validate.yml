name: Validate demo candidate
on: [pull_request, push]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false
      - name: Test application and guards
        run: |
          python -m pip install -r templates/azure/app-service/python-fastapi/app/requirements.txt -r templates/azure/app-service/python-fastapi/tests/requirements.txt
          python -m pytest templates/azure/app-service/python-fastapi/tests -q
      - name: Validate infrastructure without a cloud backend
        working-directory: templates/azure/app-service/python-fastapi/infra/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
      - name: Check the installed workflow matches the package
        run: diff .github/workflows/fastapi-azure-webapp.yml templates/azure/app-service/python-fastapi/pipelines/github-actions/deploy.yml
